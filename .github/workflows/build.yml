name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Kept explicitly because commits from Windows can lose the executable bit on gradlew.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests and assemble release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Report release APK size
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_KB=$(( (SIZE_BYTES + 512) / 1024 ))
          echo "Release APK size: ${SIZE_KB} KB (${SIZE_BYTES} bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
